name: Quokka
options:
  bundleIdPrefix: com.matthewpark
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  QuokkaDesign:
    path: QuokkaDesign
  # Chosen over SwiftData deliberately. SwiftData models are @MainActor-isolated, so a
  # 3,000-row Instagram import marshals onto the main thread, and @Attribute(.externalStorage)
  # spills blobs to loose files -- which is the exact 500k-small-files problem that storing
  # thumbnails as BLOBs exists to avoid. GRDB gives WAL, non-blocking concurrent reads through
  # DatabasePool, and direct control over page_size and blob layout.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:

  Quokka:
    type: application
    platform: iOS
    sources:
      - path: Quokka
        excludes:
          # The real one is gitignored; the example is documentation. Both are reached
          # through Base.xcconfig rather than copied into the bundle.
          - Secrets.xcconfig
          - Secrets.xcconfig.example
          - Base.xcconfig
          # Personal-use licence, untracked, and no longer referenced -- the app is SF Pro
          # only. Excluded so a copy left on disk can never ride into a submitted bundle.
          - Resources/Fonts
    configFiles:
      Debug: Quokka/Base.xcconfig
      Release: Quokka/Base.xcconfig
    dependencies:
      - package: QuokkaDesign
      - package: QuokkaDesign
        product: QuokkaEngine
      - package: QuokkaDesign
        product: QuokkaImaging
      - package: GRDB
        product: GRDB
      - target: QuokkaShare
        embed: true
    entitlements:
      path: Quokka/Quokka.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.matthewpark.quokka
    info:
      path: Quokka/Info.plist
      properties:
        CFBundleDisplayName: Quokka
        # Wired to the build settings deliberately. XcodeGen otherwise writes a literal
        # 1.0 / 1, and MARKETING_VERSION then does nothing -- you bump the version, upload,
        # and App Store Connect rejects the build as a duplicate.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A flat black field with no logo on it. Apple requires the launch screen to be
        # nearly identical to the first frame, and the wordmark animates in from code --
        # which is what makes the handoff invisible.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The mirror lives in Documents when iCloud is unavailable, and these two make that
        # folder visible in Files -- so the file can be moved by hand rather than the feature
        # being unusable until an App ID capability is enabled in the portal.
        # Declared so the share extension can hand off with extensionContext.open --
        # UIApplication.shared does not exist in an extension, and reaching for it through the
        # responder chain is the trick Apple rejects apps for.
        CFBundleURLTypes:
          - CFBundleURLName: com.matthewpark.quokka
            CFBundleURLSchemes:
              - quokka
        # Host only, never a full URL. A `//` in an xcconfig starts a comment, so
        # `https://host` silently becomes `https:` -- the scheme is added in code.
        QuokkaWorkerHost: $(QUOKKA_WORKER_HOST)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Locked light. The interface is paper, and the saved work is the only colour on
        # it; a dark appearance would invert that relationship rather than adapt it.
        # Quokka uses HTTPS and nothing else, which is the standard exemption. Declared
        # here so App Store Connect stops asking on every build.
        ITSAppUsesNonExemptEncryption: false
        # Present even though SpeechAnalyzer reads a file the user already handed over and
        # never asks for authorisation. The Speech framework is linked, Apple's static check
        # at upload looks for the string rather than for a call to requestAuthorization, and a
        # missing one is a rejection while an unused one costs nothing.
        NSSpeechRecognitionUsageDescription: >-
          Quokka reads the audio of a video you saved, on this device, to write out what was
          said. The audio is never uploaded and is discarded as soon as the words are written.
        UIUserInterfaceStyle: Light
        # Declared so a future release can add background enrichment without a plist change
        # shipping separately from the code that needs it.
        BGTaskSchedulerPermittedIdentifiers:
          - com.matthewpark.quokka.enrich
        UIBackgroundModes:
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewpark.quokka
        # Empty by default. With no worker, rung 2's config never arrives and the app runs
        # fail-closed on rung 0 -- which is a working app, not a broken one.
        QUOKKA_WORKER_HOST: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R43H5332KH
        GENERATE_INFOPLIST_FILE: NO

  QuokkaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: QuokkaShare
    dependencies:
      - package: QuokkaDesign
      - package: QuokkaDesign
        product: QuokkaEngine
      - package: QuokkaDesign
        product: QuokkaImaging
    entitlements:
      path: QuokkaShare/QuokkaShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.matthewpark.quokka
    info:
      path: QuokkaShare/Info.plist
      properties:
        CFBundleDisplayName: Quokka
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Broad on purpose. Quokka's whole premise is that it accepts a save from any
            # app with a share sheet, so narrowing this by host would defeat the point.
            # Images are accepted alongside URLs because several apps hand over a preview
            # image that is otherwise unobtainable.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewpark.quokka.share
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R43H5332KH
        GENERATE_INFOPLIST_FILE: NO

# XcodeGen does not emit a shared scheme unless one is declared, and xcodebuild refuses to
# build without one ("Found no destinations for the scheme").
schemes:
  Quokka:
    build:
      targets:
        Quokka: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
